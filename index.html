<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeutschUp</title>
<meta name="theme-color" content="#2457d6">
<meta name="description" content="Offline German vocabulary trainer with gender, plurals, verb forms and spaced repetition.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f2ec;--surface:#ffffff;--surface2:#f0ece4;--ink:#1c2230;--muted:#6a7080;--line:#e3ded3;
  --accent:#2457d6;--accent-ink:#ffffff;--accent-soft:#e6edfd;
  --der:#2b6cf0;--die:#e0453a;--das:#1c9a5e;
  --der-bg:#e7efff;--die-bg:#fdeceb;--das-bg:#e5f6ed;
  --ok:#1c9a5e;--ok-bg:#e5f6ed;--bad:#d93f35;--bad-bg:#fdeceb;--warn:#b7791f;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.08);
  --r:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141b;--surface:#1a1f2a;--surface2:#232a38;--ink:#eceff6;--muted:#9aa3b5;--line:#2c3446;
    --accent:#6c93ff;--accent-ink:#0b1020;--accent-soft:#1f2a47;
    --der:#6c9bff;--die:#ff7168;--das:#47c98a;
    --der-bg:#1d2a47;--die-bg:#3a2024;--das-bg:#16342a;
    --ok:#47c98a;--ok-bg:#16342a;--bad:#ff7168;--bad-bg:#3a2024;--warn:#e6b450;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11141b;--surface:#1a1f2a;--surface2:#232a38;--ink:#eceff6;--muted:#9aa3b5;--line:#2c3446;
  --accent:#6c93ff;--accent-ink:#0b1020;--accent-soft:#1f2a47;
  --der:#6c9bff;--die:#ff7168;--das:#47c98a;
  --der-bg:#1d2a47;--die-bg:#3a2024;--das-bg:#16342a;
  --ok:#47c98a;--ok-bg:#16342a;--bad:#ff7168;--bad-bg:#3a2024;--warn:#e6b450;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
#top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
#top h1 span{color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
#view{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
#nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
#nav button .ic{font-size:21px;line-height:1.1}
#nav button.on{color:var(--accent);background:var(--accent-soft)}
#nav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 26px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.de{direction:ltr;unicode-bidi:isolate;text-align:left}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--surface);box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{box-shadow:none;background:var(--surface2)}
.btn.block{display:flex;width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600}
.chip.lv{background:var(--accent-soft);color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button.chip{padding:7px 14px;font-size:14px}
/* word card */
.hero{height:150px;display:grid;place-items:center;font-size:76px;position:relative;background:var(--surface2);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.g-m{background:var(--der-bg)}.hero.g-f,.hero.g-p{background:var(--die-bg)}.hero.g-n{background:var(--das-bg)}
.hero .tag{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;z-index:2}
.hero .tag .chip{background:rgba(255,255,255,.85);color:#222;backdrop-filter:blur(4px)}
.hero.noemoji{height:56px}
.wtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;direction:ltr;text-align:left}
.art{font-size:26px;font-weight:800}
.lemma{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.15;word-break:break-word}
.g-m{color:var(--der)}.g-f,.g-p{color:var(--die)}.g-n{color:var(--das)}
.lemma.plain{color:var(--ink)}
.en{font-size:19px;font-weight:600;margin:2px 0 10px}
.speak{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
.speak.sm{width:34px;height:34px;font-size:15px;border-radius:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;direction:ltr;text-align:left;align-items:baseline}
.kv .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:18px;font-weight:700}
.ex{margin-top:12px;padding:12px 14px;background:var(--surface2);border-radius:14px}
.ex .de{font-size:17px;font-weight:600}
.ex .en2{font-size:14px;color:var(--muted);direction:ltr;text-align:left;margin-top:2px}
.prep{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;direction:ltr}
.prep b.A{color:var(--die)}.prep b.D{color:var(--der)}.prep b.G{color:var(--warn)}.prep b.W{color:var(--das)}
.case{font-weight:800}.case.A{color:var(--die)}.case.D{color:var(--der)}.case.G{color:var(--warn)}.case.W{color:var(--das)}
/* discover */
.goal{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
#stack{position:relative;touch-action:pan-y}
#topcard{transition:transform .25s,opacity .25s;will-change:transform;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.swipehint{position:absolute;top:70px;z-index:5;font-weight:800;font-size:22px;padding:6px 14px;border:3px solid;border-radius:12px;opacity:0;transform:rotate(-8deg);pointer-events:none}
.swipehint.l{inset-inline-start:16px;color:var(--ok);border-color:var(--ok);background:var(--surface)}
.swipehint.s{inset-inline-end:16px;color:var(--muted);border-color:var(--muted);background:var(--surface)}
.actions{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:14px}
.actions .btn{flex-direction:column;gap:0;min-height:62px;font-size:14px}
.actions .btn span{font-size:20px}
/* review */
.qhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.qbox{padding:20px 18px}
.qlabel{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.qword{font-size:34px;font-weight:800;line-height:1.2;direction:ltr;text-align:left;word-break:break-word}
.qemoji{font-size:44px;line-height:1}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{direction:ltr;min-height:56px;padding:12px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:18px;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid transparent}
.opt.de{justify-content:space-between}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts.arts{grid-template-columns:repeat(3,1fr)}
.opts.arts .opt{justify-content:center;font-size:22px;font-weight:800}
.opt.der{color:var(--der)}.opt.die{color:var(--die)}.opt.das{color:var(--das)}
.typebox{display:flex;gap:8px;margin-top:16px}
.typebox input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font-size:20px;font-weight:700;direction:ltr;text-align:left}
.typebox input:focus{outline:none;border-color:var(--accent)}
.typebox input.ok{border-color:var(--ok);background:var(--ok-bg)}
.typebox input.bad{border-color:var(--bad);background:var(--bad-bg)}
.umlauts{display:flex;gap:8px;margin-top:10px;direction:ltr}
.umlauts button{flex:1;height:42px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:18px}
.fb{margin-top:16px;border-radius:var(--r);overflow:hidden}
.fb .banner{padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb.ok .banner{background:var(--ok-bg);color:var(--ok)}
.fb.bad .banner{background:var(--bad-bg);color:var(--bad)}
.fb .body{padding:14px 16px;background:var(--surface)}
.sticky{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.stat div{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .big{font-size:56px}
/* list */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:14px;padding:4px;margin:4px 0 12px}
.seg button{padding:8px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{width:100%;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--accent)}
.li{direction:ltr;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:16px;margin-bottom:8px;width:100%;text-align:start}
.li .main{flex:1;min-width:0}
.li .w{font-weight:800;font-size:18px;direction:ltr;text-align:left}
.li .e{font-size:14px;color:var(--muted);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.add{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.add.done{background:var(--ok-bg);color:var(--ok);font-size:18px}
/* sheets */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(10,14,25,.5);pointer-events:auto;animation:fade .2s}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;pointer-events:auto;animation:up .25s;padding-bottom:env(safe-area-inset-bottom)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:8px auto}
.sheet .sx{position:absolute;top:10px;inset-inline-end:12px;width:36px;height:36px;border-radius:12px;background:var(--surface);z-index:3}
.sheetbody{padding:6px 16px 20px}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px;pointer-events:auto;box-shadow:var(--shadow);z-index:60;max-width:92vw}
.toast button{color:var(--accent);font-weight:800;filter:brightness(1.4)}
/* settings */
.group{margin-bottom:18px}
.group h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 4px 8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:54px}
.set:last-child{border:0}
.set select,.set input[type=number]{background:var(--surface2);border:0;border-radius:10px;padding:8px 10px;min-width:90px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{inset-inline-start:23px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 12px;direction:ltr;text-align:left}
.field input:focus{outline:none;border-color:var(--accent)}
.hist{display:flex;gap:5px;align-items:flex-end;height:60px;margin-top:8px;direction:ltr}
.hist i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.hist i.z{background:var(--line)}
.confetti{font-size:64px;text-align:center}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;font-weight:800;font-size:15px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent}
.grades button small{font-size:12px;font-weight:600;color:var(--muted)}
.grades button.g0{color:var(--bad)}.grades button.g1{color:var(--warn)}.grades button.g2{color:var(--ok)}.grades button.g3{color:var(--accent)}
.manrow{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.manrow .chip{font-size:12px;padding:4px 9px}
.medit{display:flex;gap:6px;align-items:center;margin-bottom:6px;direction:ltr}
.medit input{flex:1;min-width:0;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:0 10px}
.medit button{width:38px;height:38px;border-radius:10px;background:var(--surface2);flex:none}
.exedit{background:var(--surface2);border-radius:12px;padding:8px;margin-bottom:8px;direction:ltr}
.exedit input{width:100%;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:0 10px;margin-bottom:6px}
.exedit .rm{color:var(--bad);font-size:13px;font-weight:700}
.exmine{font-size:11px;color:var(--accent);font-weight:700}
.src{font-size:12px;line-height:1.7;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="layer"></div>
<script src="words.js"></script>
<script src="legacy.js"></script>
<script>

   DeutschUp – offline German vocabulary trainer
   ============================================================ */

  theme:'پوسته', themeAuto:'خودکار', themeLight:'روشن', themeDark:'تیره', language:'زبان رابط',

/* ---------------- state & storage ---------------- */
const DEFAULT_SET = {levels:['A1','A2','B1','B2'], types:['n','v','a','p','x'], goal:20, grading:'buttons', rate:0.9, voice:'', autoSpeak:true, photo:false, theme:'auto', lang:'fa'};
let S = {v:2, u:0, prog:{}, custom:[], set:{...DEFAULT_SET}, days:{}, img:{}, skip:{}, ed:{}};
let ALL = [], BYID = new Map();

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('deutschup', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
function migrate() {
  if ((S.v || 1) >= 2) return;
  const np = {}, ns = {}, used = new Set();
  const m = id => { const k = LEGACY_MAP[id]; if (k !== undefined) { used.add(k); return k; } return +id; };
  for (const id in S.prog) np[m(id)] = S.prog[id];
  for (const id in S.skip) ns[m(id)] = S.skip[id];
  S.prog = np; S.skip = ns;
  const have = new Set(S.custom.map(x => x.id));
  for (const e of LEGACY_EXTRA) if (used.has(e.id) && !have.has(e.id)) S.custom.push(e);
  S.v = 2;
}
async function loadState() {
  let a = null, b = null;
  try { const s = localStorage.getItem('deutschup'); if (s) a = JSON.parse(s); } catch (e) {}
  try { const s = await idbGet('state'); if (s) b = JSON.parse(s); } catch (e) {}
  const best = [a, b].filter(Boolean).sort((x, y) => (y.u || 0) - (x.u || 0))[0];
  if (best) { S = {...S, ...best, set: {...DEFAULT_SET, ...(best.set || {})}}; if (!S.ed) S.ed = {}; migrate(); }
}
let saveTimer;
function save() { S.u = Date.now(); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 250); }
async function persist() {
  const s = JSON.stringify(S);
  try { localStorage.setItem('deutschup', s); } catch (e) {}
  try { await idbSet('state', s); } catch (e) {}
}
addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

const meaningsOf = w => String(w.en || '').split(/,\s*(?![^()]*\))/).map(x => x.trim()).filter(Boolean);
function applyEdits(w) {
  if (w.en0 === undefined) { w.en0 = w.en; w.ex0 = w.ex; w.ee0 = w.ee; w.pp0 = w.pp; w.pl0 = w.pl; }
  w.en = w.en0; w.ex = w.ex0; w.ee = w.ee0; w.pp = w.pp0; w.pl = w.pl0; w.xs = null;
  const e = S.ed[w.id];
  if (e) {
    if (e.en && e.en.length) w.en = e.en.join(', ');
    if (e.pp) w.pp = e.pp.length ? e.pp : undefined;
    if (e.pl != null && e.pl !== '') w.pl = e.pl;
    if (e.xs) w.xs = e.xs;
  }
  if (!w.xs) w.xs = w.ex ? [{d:w.ex, e:w.ee || ''}] : [];
  w.ex = w.xs.length ? w.xs[0].d : ''; w.ee = w.xs.length ? (w.xs[0].e || '') : '';
}
function buildAll() {
  ALL = WORDS.concat(S.custom);
  ALL.forEach(applyEdits);
  BYID = new Map(ALL.map(w => [w.id, w]));
  const by = {};
  ALL.forEach(w => (by[w.t] = by[w.t] || []).push(w));
  for (const k in by) { by[k].sort((a, b) => a.o - b.o); by[k].forEach((w, i) => w.dk = (i + 0.5) / by[k].length); }
}
const todayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function day(k = todayKey()) { return S.days[k] || (S.days[k] = {n:0, r:0, c:0}); }
function streak() {
  let n = 0, d = new Date();
  const has = x => { const o = S.days[todayKey(x)]; return o && (o.n + o.r) > 0; };
  if (!has(d)) d = new Date(Date.now() - DAY);
  while (has(d)) { n++; d = new Date(d.getTime() - DAY); }
  return n;
}

/* ---------------- text helpers ---------------- */
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').trim();
const normDE = s => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, ' ').trim();
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const CASE = {A:'Akk.', D:'Dat.', G:'Gen.', W:'Akk./Dat.'};
const caseName = c => ({A:'Akkusativ', D:'Dativ', G:'Genitiv', W:'Akk. / Dat.'}[c]);
const prepStr = p => { const [a, c] = p.split('+'); return `${a} + ${CASE[c] || c}`; };
const prepHTML = p => { const [a, c] = p.split('+'); return `<span class="prep">${esc(a)} <b class="${c}">${CASE[c] || c}</b></span>`; };
const fullDE = w => w.t === 'n' ? `${ART[w.g]} ${w.w}` : w.w;
const mainEN = w => w.en;
const isDue = (p, now = Date.now()) => p && p.k !== 'k' && p.d <= now;

/* ---------------- speech ---------------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)); } catch (e) { voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = S.set.rate;
    const v = voices.find(v => v.voiceURI === S.set.voice) || voices.find(v => /de-DE/i.test(v.lang)) || voices[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const speakable = w => w.t === 'n' ? `${ART[w.g]} ${w.w}` : w.w.replace(/ … /g, ' ').replace(/^sich /, '');

/* ---------------- photos (optional, online) ---------------- */
async function photoURL(w) {
  if (S.img[w.id] !== undefined) return S.img[w.id];
  const term = meaningsOf(w)[0] || w.en;
  const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(term.replace(/^to /, '')), {headers:{Accept:'application/json'}});
  const j = r.ok ? await r.json() : null;
  const url = j && j.type !== 'disambiguation' && j.thumbnail ? j.thumbnail.source : '';
  S.img[w.id] = url; save(); return url;
}
async function loadPhoto(w, el) {
  if (!S.set.photo || w.t !== 'n' || !navigator.onLine) return;
  try {
    const url = await photoURL(w);
    if (!url || !el.isConnected) return;
    const im = new Image(); im.alt = '';
    im.onload = () => { if (!el.isConnected || el.querySelector('img')) return; el.classList.remove('noemoji'); el.appendChild(im); };
    im.src = url;
  } catch (e) {}
}
async function cachePhotos() {
  if (!navigator.onLine) { toast(t('lookupFail')); return; }
  const ws = Object.keys(S.prog).map(id => BYID.get(+id)).filter(w => w && w.t === 'n' && S.img[w.id] === undefined);
  let n = 0;
  for (const w of ws) { try { const u = await photoURL(w); if (u) { const im = new Image(); im.src = u; n++; } } catch (e) {} await new Promise(r => setTimeout(r, 150)); }
  toast(t('photosDone') + ' (' + n + ')');
}

/* ---------------- word card ---------------- */
function artClass(w) { return 'g-' + (w.g || 'x'); }
function heroHTML(w) {
  const lv = `<span class="chip lv">${w.lv || '·'}</span>`;
  const ty = `<span class="chip">${t('t_' + w.t)}</span>`;
  const dh = w.t === 'n' ? ` data-hero="${w.id}"` : '';
  if (w.e) return `<div class="hero ${w.t === 'n' ? artClass(w) : ''}"${dh}><div class="tag">${ty}${lv}</div><span>${w.e}</span></div>`;
  return `<div class="hero noemoji ${w.t === 'n' ? artClass(w) : ''}"${dh}><div class="tag">${ty}${lv}</div></div>`;
}
function titleHTML(w) {
  const sp = `<button class="speak" data-say="${esc(speakable(w))}" aria-label="speak">🔊</button>`;
  if (w.t === 'n') return `<div class="row" style="direction:ltr"><div class="wtitle"><span class="art ${artClass(w)}">${ART[w.g]}</span><span class="lemma ${artClass(w)}">${esc(w.w)}</span></div><span class="sp"></span>${sp}</div>`;
  return `<div class="row" style="direction:ltr"><div class="wtitle"><span class="lemma plain">${esc(w.w)}</span></div><span class="sp"></span>${sp}</div>`;
}
function detailsHTML(w) {
  let h = '';
  if (w.t === 'n') {
    const pl = w.g === 'p' ? `<span class="muted">${t('plOnly')}</span>` : (w.pl === '–' ? `<span class="muted">${t('noPlural')}</span>` : `<span class="g-f">die</span> ${esc(w.pl)}`);
    h += `<div class="kv"><span class="k">Plural</span><span class="v">${pl}</span></div>`;
  } else if (w.t === 'v') {
    h += `<div class="kv"><span class="k">er/sie/es</span><span class="v">${esc(w.p3)}</span><span class="k">Präteritum</span><span class="v">${esc(w.pr)}</span><span class="k">Perfekt</span><span class="v">${esc(w.pf)}</span></div>`;
    const pp = (w.pp || []).map(prepHTML).join(' ');
    const cs = w.cs ? `<span class="prep">+ <b class="${w.cs}">${CASE[w.cs]}</b></span>` : '';
    if (pp || cs) h += `<div class="row" style="flex-wrap:wrap;direction:ltr;margin:6px 0">${pp} ${cs}</div>`;
  } else if (w.t === 'a' && w.cm) {
    h += `<div class="kv"><span class="k">${t('comp')}</span><span class="v">${esc(w.cm)}</span><span class="k">${t('sup')}</span><span class="v">${esc(w.su)}</span></div>`;
  } else if (w.t === 'p' && w.cs) {
    h += `<div class="row" style="direction:ltr;margin:6px 0"><span class="prep">+ <b class="${w.cs}">${caseName(w.cs)}</b></span></div>`;
  }
  return h;
}
function exHTML(w) {
  return (w.xs || []).map(x => `<div class="ex"><div class="row" style="align-items:flex-start;direction:ltr"><div class="de" style="flex:1">${esc(x.d)}${x.m ? ' <span class="exmine">★ ' + t('myExample') + '</span>' : ''}</div><button class="speak sm" data-say="${esc(x.d)}" aria-label="speak">🔊</button></div>${x.e ? `<div class="en2">${esc(x.e)}</div>` : ''}</div>`).join('');
}
function cardHTML(w, o = {}) {
  return `${o.noHero ? '' : heroHTML(w)}<div class="pad">${titleHTML(w)}<div class="en de">${esc(w.en)}</div>${detailsHTML(w)}${exHTML(w)}</div>`;
}
function afterCard(root) {
  root.querySelectorAll('[data-hero]').forEach(el => { const w = BYID.get(+el.dataset.hero); if (w) loadPhoto(w, el); });
}

const NAV = [['discover', '🧭'], ['review', '🔁'], ['list', '📚'], ['more', '⚙️']];
function dueCount() { const now = Date.now(); let n = 0; for (const id in S.prog) if (isDue(S.prog[id], now)) n++; return n; }
function renderChrome() {
  document.documentElement.lang = S.set.lang;
  document.documentElement.dir = S.set.lang === 'fa' ? 'rtl' : 'ltr';
  document.documentElement.dataset.theme = S.set.theme === 'auto' ? '' : S.set.theme;

}
function go(v) { view = v; if (v !== 'review') R = null; render(); $('#view').scrollTop = 0; }

/* ---- online lookup (Wiktionary, needs internet) ---- */
const stripHTML = h => { const d = document.createElement('div'); d.innerHTML = h; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
async function lookupOnline(q) {
  toast(t('lookingUp'));
  const tries = [...new Set([q.trim(), q.trim().charAt(0).toUpperCase() + q.trim().slice(1)])];
  for (const word of tries) {
    try {
      const r = await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(word));
      if (!r.ok) continue;
      const j = await r.json(); const de = j.de; if (!de || !de.length) continue;
      const MAP = {Noun:'n', Verb:'v', Adjective:'a', Adverb:'x', Preposition:'p', Conjunction:'x'};
      const ent = de.find(x => MAP[x.partOfSpeech]) || de[0];
      const data = {w:word, t:MAP[ent.partOfSpeech] || 'x', en:(ent.definitions || []).map(d => stripHTML(d.definition)).filter(x => x && x.length < 80).slice(0, 3).join(', '), ex:'', ee:''};
      const dex = (ent.definitions || []).flatMap(d => d.parsedExamples || []).find(x => x && x.example);
      if (dex) data.ex = stripHTML(dex.example);
      try {
        const r2 = await fetch('https://de.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json&origin=*&page=' + encodeURIComponent(word));
        const wt = ((await r2.json()).parse || {}).wikitext; const txt = wt && wt['*'] || '';
        const g = txt.match(/\|\s*Genus\s*=\s*([mfn])/); if (g) data.g = g[1];
        const pl = txt.match(/\|\s*Nominativ Plural(?: 1)?\s*=\s*([^\n|}]+)/); if (pl) data.pl = pl[1].trim();
        const p3 = txt.match(/\|\s*Präsens_er, sie, es\s*=\s*([^\n|}]+)/), pr = txt.match(/\|\s*Präteritum_ich\s*=\s*([^\n|}]+)/), pp = txt.match(/\|\s*Partizip II\s*=\s*([^\n|}]+)/), hv = txt.match(/\|\s*Hilfsverb\s*=\s*(haben|sein)/);
        if (p3) data.p3 = p3[1].trim(); if (pr) data.pr = pr[1].trim(); if (pp) data.pf = ((hv ? hv[1] === 'sein' ? 'ist' : 'hat' : 'hat') + ' ' + pp[1].trim());
      } catch (e) {}
      if (data.t === 'n' && !data.g) data.t = 'n';
      closeSheet(); customSheet(word, data); return;
    } catch (e) {}
  }
  toast(t('lookupFail'));
}
function searchSheet() {
  openSheet(`<div style="margin-top:34px"><input class="search" id="sq" placeholder="${t('searchAll')}" autocomplete="off" autocapitalize="off"></div><div id="sres"></div>`, d => {
    const inp = $('#sq'); inp.focus();

      const extra = `<div class="empty" style="padding:16px 12px"><button class="btn block" data-act="lookup" data-q="${esc(inp.value)}">🌐 ${t('lookup')}</button><button class="btn ghost block" style="margin-top:8px" data-act="customFrom" data-q="${esc(inp.value)}">${t('addThis')}</button></div>`;

  <label class="field"><span>${t('meaning')}</span><input id="c_en"></label>
  <label class="field"><span>${t('example')}</span><input id="c_ex"></label>
  <label class="field"><span>${t('exampleEn')}</span><input id="c_ee"></label>
  <button class="btn pri block" data-act="saveCustom">${t('save')}</button>`, () => {
    const sync = () => { const ty = $('#c_t').value; $('#c_n').hidden = ty !== 'n'; $('#c_v').hidden = ty !== 'v'; };
    $('#c_t').onchange = sync;
    const set = (id, v) => { if (v !== undefined && $(id)) $(id).value = v; };
    set('#c_t', D.t); sync(); set('#c_g', D.g); set('#c_pl', D.pl); set('#c_p3', D.p3); set('#c_pr', D.pr); set('#c_pf', D.pf); set('#c_en', D.en); set('#c_ex', D.ex); set('#c_ee', D.ee);
  });
}
function saveCustom() {
  const ty = $('#c_t').value, w = $('#c_w').value.trim(), en = $('#c_en').value.trim();
  if (!w || !en) return;
  const id = Math.max(100000, ...S.custom.map(x => x.id)) + 1;
  const e = {id, o:99999 + S.custom.length, t:ty, w, en, ex:$('#c_ex').value.trim(), ee:$('#c_ee').value.trim(), lv:'B1', custom:1};
  if (ty === 'n') { e.g = $('#c_g').value; e.pl = $('#c_pl').value.trim() || '–'; }
  if (ty === 'v') { e.p3 = $('#c_p3').value.trim() || '?'; e.pr = $('#c_pr').value.trim() || '?'; e.pf = $('#c_pf').value.trim() || '?'; const pp = $('#c_pp').value.trim(); if (pp) e.pp = pp.split(/[,;]/).map(x => x.trim()).filter(Boolean); }
  S.custom.push(e); buildAll(); S.prog[id] = {s:0, d:Date.now(), k:'l', ok:0, ko:0}; day().n++; save(); closeSheet(); toast(t('added')); render();
}
function exportData() {
  const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `deutschup-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(t('exported'));
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-nav],[data-act],[data-opt],[data-art],[data-say],[data-open],[data-quick],[data-ltab],[data-chip],[data-tog],[data-ins],[data-sheet],[data-close]');
  if (!el) return;
  const d = el.dataset;
  if (d.say) { speak(d.say); return; }
  if (d.close) { closeSheet(); return; }
  if (d.nav) { closeSheet(); go(d.nav); return; }
  if (d.quick) { e.stopPropagation(); const id = +d.quick; S.prog[id] = {s:0, d:Date.now(), k:'l', ok:0, ko:0}; day().n++; save(); el.outerHTML = '<span class="add done">✓</span>'; toast(t('added')); renderChrome(); return; }
  if (d.open) { wordSheet(+d.open); return; }
  if (d.ltab) { listTab = d.ltab; render(); return; }
  if (d.opt !== undefined) { if (!R || !R.cur || R.ans) return; const i = +d.opt, o = R.cur.ex.opts[i]; answerQ(o.ok, i); renderReview($('#view')); return; }
  if (d.art) { if (!R || !R.cur || R.ans) return; const q = R.cur.ex; answerQ(d.art === q.answer, q.arts.indexOf(d.art)); renderReview($('#view')); return; }
  if (d.ins) { const i = $('#typed'); if (i) { const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + d.ins + i.value.slice(p); i.focus(); i.setSelectionRange(p + 1, p + 1); } return; }
  if (d.chip) { const arr = S.set[d.chip], v = d.v, i = arr.indexOf(v); if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(v); save(); render(); return; }
  if (d.tog) { S.set[d.tog] = !S.set[d.tog]; save(); render(); return; }
  if (d.sheet) {
    const id = +d.id, w = BYID.get(id);
    if (d.sheet === 'add') { S.prog[id] = {s:0, d:Date.now(), k:'l', ok:0, ko:0}; day().n++; toast(t('added')); }
    else if (d.sheet === 'know') { S.prog[id] = {s:STAGES, d:8e15, k:'k', ok:0, ko:0}; toast(t('markedKnown')); }
    else if (d.sheet === 'reset') { S.prog[id] = {s:0, d:Date.now(), k:'l', ok:0, ko:0}; }
    else if (d.sheet === 'remove') { delete S.prog[id]; if (w && w.custom) { S.custom = S.custom.filter(x => x.id !== id); buildAll(); } }
    save(); closeSheet(); render(); return;
  }
  switch (d.act) {
    case 'learn': case 'know': case 'skip': discoverAct(d.act); break;
    case 'search': searchSheet(); break;
    case 'startReview': startReview(false); break;
    case 'startBatch': startReview(false, +d.n); break;
    case 'grade': gradeNow(+d.g); break;
    case 'showMan': R.man = !R.man; renderReview($('#view')); break;
    case 'man': gradeNow(2, +d.n); break;
    case 'editWord': closeSheet(); editSheet(+d.id); break;
    case 'editAddM': E.ms.push(''); editRender(); break;
    case 'editDelM': E.ms.splice(+d.i, 1); editRender(); break;
    case 'editAddX': E.xs.push({d:'', e:'', m:1}); editRender(); break;
    case 'editDelX': E.xs.splice(+d.i, 1); editRender(); break;
    case 'editSave': editSave(); break;
    case 'editRestore': editRestore(); break;
    case 'lookup': lookupOnline(d.q); break;
    case 'cachePhotos': cachePhotos(); break;
    case 'practice': startReview(true); break;
    case 'endReview': R = null; render(); break;
    case 'nextQ': nextQuestion(); renderChrome(); break;
    case 'submitType': submitTyped(); break;
    case 'custom': customSheet(); break;
    case 'customFrom': customSheet(d.q); break;
    case 'saveCustom': saveCustom(); break;
    case 'export': exportData(); break;
    case 'import': $('#impf').click(); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } break;
    case 'resetAll': if (await confirmBox(t('confirmReset'))) { S.prog = {}; S.custom = []; S.days = {}; S.skip = {}; S.ed = {}; buildAll(); save(); render(); } break;
  }
});
document.addEventListener('change', e => {
  const ms = e.target.closest('[data-mansel]');
  if (ms) { const id = +ms.dataset.mansel, p = S.prog[id]; if (p) { p.man = ms.value ? +ms.value : null; if (p.man && p.k !== 'k') p.d = (p.ts || Date.now()) + p.man * DAY; save(); toast('✓'); render(); } return; }
  const sel = e.target.closest('[data-sel]');
  if (sel) { const k = sel.dataset.sel; let v = sel.value; if (k === 'goal') v = +v; if (k === 'rate') v = parseFloat(v); S.set[k] = v; save(); if (k === 'voice') speak('Guten Tag!'); render(); return; }
  if (e.target.id === 'impf') {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); if (!j.prog) throw 0; S = {...S, ...j, set: {...DEFAULT_SET, ...(j.set || {})}}; if (!S.ed) S.ed = {}; migrate(); buildAll(); save(); toast(t('imported')); render(); } catch (x) { toast(t('badFile')); } };
    r.readAsText(f);
  }
});
document.addEventListener('input', e => {
  if (!E) return; const d = e.target.dataset;
  if (d.em !== undefined) E.ms[+d.em] = e.target.value;
  else if (d.exd !== undefined) E.xs[+d.exd].d = e.target.value;
  else if (d.exe !== undefined) E.xs[+d.exe].e = e.target.value;
  else if (d.ef) E[d.ef] = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.target.matches('input,select,textarea')) return;
  if (view === 'discover' && !$('#sheetwrap')) { if (e.key === 'ArrowRight') discoverAct('learn'); else if (e.key === 'ArrowLeft') discoverAct('skip'); else if (e.key === 'ArrowUp') discoverAct('know'); }
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && R && R.ans) { if (R.ans.needGrade && R.ans.g === undefined) gradeNow(2); else { nextQuestion(); renderChrome(); } }
});

/* ---------------- boot ---------------- */
(async function boot() {
  await loadState();
  buildAll();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.__app = {get S() { return S; }, get R() { return R; }, go, speak};
</script>
